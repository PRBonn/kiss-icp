# NOTE: Please note that this is just an example of the advanced configuration for the KISS-ICP
# pipeline and it's not really meant to use for any particular dataset, is just to expose other
# options that are disabled by default

kiss_icp_node:
  ros__parameters:
    ####    /!\ If you set these ROS-related parameters in the file, they will overwrite the corresponding launch arguments   ####

    # base_frame: ""
    # lidar_odom_frame: "odom_lidar"
    # publish_odom_tf: True
    # invert_odom_tf: True
    # position_covariance: 0.1
    # orientation_covariance: 0.1

    ####    Adaptive Covariance Parameters    ####
    # Set enable: true to activate adaptive covariance based on registration quality
    # Set metrics_only_mode: true to collect metrics but publish fixed covariance (for calibration)
    adaptive_covariance:
      enable: false  # DEFAULT: DISABLED (backward compatible)
      metrics_only_mode: false  # Collect metrics but use fixed covariance (for finding nominal_keypoints)
      nominal_keypoints: 1000.0    # Expected keypoints in feature-rich environment
      min_ratio: 0.5               # Start increasing covariance below 50% of nominal
      max_multiplier: 10.0         # Maximum 10x covariance inflation
      enable_smoothing: true       # Smooth covariance changes over time
      smoothing_alpha: 0.3         # Higher = less smoothing (0.0-1.0)

    ####    Core KISS-ICP parameters    ####

    data:
      deskew: True
      max_range: 100.0
      min_range: 0.0

    mapping:
      # voxel_size: 1.0 # <- optional, default = max_range / 100.0
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      max_num_iterations: 500 # <- optional
      convergence_criterion: 0.0001 # <- optional
      max_num_threads: 0 # <- optional, 0 means automatic
